<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3C7" />
      <stop offset="35%" stop-color="#E5C07B" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7818" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A191F" />
      <stop offset="100%" stop-color="#0B0B0E" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Subtle inner border -->
  <rect x="9" y="9" width="110" height="110" rx="24" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.25" />

  <!-- NN Monogram -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- First N -->
    <path d="M 28 92 V 36 H 38 L 56 72 V 36 H 64 V 92 H 54 L 36 56 V 92 Z" />
    <!-- Second N (overlapping/staggered) -->
    <path d="M 64 92 V 36 H 74 L 92 72 V 36 H 100 V 92 H 90 L 72 56 V 92 Z" />
  </g>
</svg>
